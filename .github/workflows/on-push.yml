name: Run Tests

on:
  push:

jobs:
  run-integration-tests:
    name: Run Integration Tests
    uses: ./.github/workflows/run-integration-tests.yml
    secrets: inherit

  run-android-tests:
    name: Run Android Tests
    uses: ./.github/workflows/run-android-tests.yml
    secrets: inherit

  run-ios-tests:
    name: Run iOS Tests
    uses: ./.github/workflows/run-ios-tests.yml
    secrets: inherit

  reproduce-pnpm-recursion:
    name: Reproduce pnpm Install Recursion
    uses: ./.github/workflows/reproduce-pnpm-recursion.yml
    with:
      branch: MV-1170
    secrets: inherit
